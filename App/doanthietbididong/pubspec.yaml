name: doanthietbididong
description: Food menu demo (Flutter port)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ⚙️ HTTP client mới — tương thích flutter_cache_manager >=3.4.0
  http: ^1.2.2

  # 📦 Hiển thị ảnh có cache
  cached_network_image: ^3.3.1

  # 🔡 Hỗ trợ bỏ dấu tiếng Việt khi tìm kiếm
  diacritic: ^0.1.2

  # 📸 Chụp/chọn ảnh
  image_picker: ^1.0.7

  # 💾 Lưu dữ liệu cục bộ
  shared_preferences: ^2.2.3

  # 🧩 Cache manager (phải nằm trong dependencies, không phải dev)
  flutter_cache_manager: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
